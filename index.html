<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nosso Cantinho</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- ========================================== -->
    <!-- TELA DE INÍCIO                              -->
    <!-- ========================================== -->
    <div id="tela-inicio" class="tela ativa">
        <div class="cartao-inicio">
            <h1 class="titulo-inicio">Você deseja abrir?</h1>
            <div class="botoes-inicio">
                <button id="btn-sim" class="botao botao-sim">Sim</button>
                <button id="btn-nao" class="botao botao-nao">Não</button>
            </div>
        </div>
    </div>

    <!-- ========================================== -->
    <!-- MENU PRINCIPAL                              -->
    <!-- ========================================== -->
    <div id="tela-menu" class="tela">
        <header class="cabecalho">
            <h1 class="titulo-principal">Nosso Cantinho</h1>
            <button id="btn-musica" class="botao-musica" title="Música">🔊</button>
        </header>

        <main class="menu-principal">
            <button class="botao-menu" data-secao="dedicatorias">💌 Dedicatórias</button>
            <button class="botao-menu" data-secao="midias">📖 Mídias</button>
            <button class="botao-menu" data-secao="memorias">🗓️ Memórias</button>
            <button class="botao-menu" data-secao="interacao">🎮 Interação</button>
            <button class="botao-menu" data-secao="surpresa">🎁 Surpresa</button>
        </main>
    </div>

    <!-- ========================================== -->
    <!-- SEÇÃO: DEDICATÓRIAS                         -->
    <!-- ========================================== -->
    <div id="tela-dedicatorias" class="tela secao-interna">
        <header class="cabecalho-secao">
            <button class="botao-voltar">← Voltar</button>
            <h2>💌 Dedicatórias</h2>
            <div class="espaco"></div>
        </header>
        <main class="conteudo-dedicatorias">
            <!-- Cartas são geradas via JavaScript -->
        </main>
    </div>

    <!-- ========================================== -->
    <!-- SEÇÃO: MÍDIAS (LIVRO)                       -->
    <!-- ========================================== -->
    <div id="tela-midias" class="tela secao-interna">
        <header class="cabecalho-secao">
            <button class="botao-voltar">← Voltar</button>
            <h2>📖 Mídias</h2>
            <div class="espaco"></div>
        </header>
        <main class="conteudo-midias">
            <div class="livro-container">
                <button class="seta-livro seta-esquerda" id="livro-anterior">←</button>
                <div class="livro">
                    <div class="pagina esquerda" id="pagina-esquerda"></div>
                    <div class="pagina direita" id="pagina-direita"></div>
                </div>
                <button class="seta-livro seta-direita" id="livro-proxima">→</button>
            </div>
            <div class="contador-paginas" id="contador-paginas">1 / 1</div>
        </main>
    </div>

    <!-- ========================================== -->
    <!-- SEÇÃO: MEMÓRIAS (CALENDÁRIO)                -->
    <!-- ========================================== -->
    <div id="tela-memorias" class="tela secao-interna">
        <header class="cabecalho-secao">
            <button class="botao-voltar">← Voltar</button>
            <h2>🗓️ Memórias</h2>
            <div class="espaco"></div>
        </header>
        <main class="conteudo-memorias">
            <div class="calendario-header">
                <button class="botao-calendario" id="mes-anterior">←</button>
                <h3 id="mes-atual"></h3>
                <button class="botao-calendario" id="mes-proximo">→</button>
            </div>
            <div class="calendario-grid">
                <div class="dia-semana">DOM</div>
                <div class="dia-semana">SEG</div>
                <div class="dia-semana">TER</div>
                <div class="dia-semana">QUA</div>
                <div class="dia-semana">QUI</div>
                <div class="dia-semana">SEX</div>
                <div class="dia-semana">SÁB</div>
                <div id="calendario-dias" class="calendario-dias"></div>
            </div>
        </main>
    </div>

    <!-- ========================================== -->
    <!-- SEÇÃO: INTERAÇÃO (MINI JOGO)                -->
    <!-- ========================================== -->
    <div id="tela-interacao" class="tela secao-interna">
        <header class="cabecalho-secao">
            <button class="botao-voltar">← Voltar</button>
            <h2>🎮 Interação</h2>
            <div class="espaco"></div>
        </header>
        <main class="conteudo-interacao">
            <div class="jogo-container" id="jogo-container">
                <p class="instrucao-jogo">Clique nos corações para encontrá-los!</p>
                <p class="placar" id="placar">Corações encontrados: 0 / 10</p>
                <div class="area-coracoes" id="area-coracoes"></div>
                <button class="botao-reiniciar" id="btn-reiniciar-jogo">Reiniciar</button>
            </div>
        </main>
    </div>

    <!-- ========================================== -->
    <!-- SEÇÃO: SURPRESA                             -->
    <!-- ========================================== -->
    <div id="tela-surpresa" class="tela secao-interna">
        <header class="cabecalho-secao">
            <button class="botao-voltar">← Voltar</button>
            <h2>🎁 Surpresa</h2>
            <div class="espaco"></div>
        </header>
        <main class="conteudo-surpresa">
            <div class="surpresa-container" id="surpresa-container">
                <p class="texto-surpresa-intro">Você chegou até aqui...</p>
                <button class="botao botao-surpresa" id="btn-abrir-surpresa">Abrir surpresa</button>
            </div>
            <div class="surpresa-revelada" id="surpresa-revelada" style="display: none;">
                <p class="texto-surpresa-final" id="texto-surpresa-final"></p>
            </div>
        </main>
    </div>

    <!-- ========================================== -->
    <!-- MODAL: MEMÓRIA DO CALENDÁRIO                -->
    <!-- ========================================== -->
    <div id="modal-memoria" class="modal">
        <div class="modal-conteudo">
            <button class="modal-fechar" id="modal-fechar">×</button>
            <h3 id="modal-titulo"></h3>
            <p id="modal-texto"></p>
            <img id="modal-imagem" src="" alt="" style="display: none;">
        </div>
    </div>

    <!-- ========================================== -->
    <!-- MODAL: CARTA (DEDICATÓRIA)                  -->
    <!-- ========================================== -->
    <div id="modal-carta" class="modal">
        <div class="modal-conteudo carta-modal-conteudo">
            <button class="modal-fechar" id="carta-fechar">×</button>
            <h3 id="carta-titulo"></h3>
            <p id="carta-texto"></p>
        </div>
    </div>

    <!-- ========================================== -->
    <!-- EFEITO: CORAÇÕES/CONFETES                   -->
    <!-- ========================================== -->
    <div id="efeito-container" class="efeito-container"></div>

    <script src="js/script.js"></script>
</body>
</html>
